# Application Name
spring.application.name=SecureBank

# Server Configuration
server.port=8080

# H2 Database Configuration (In-Memory)
spring.datasource.url=jdbc:h2:mem:bankingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging - disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.itnaf.banking=DEBUG

# Custom Properties
app.org.id=${ORG_ID:your_org_id}
app.page.id=${PAGE_ID:your_page_id}
app.profiling.server=${PROFILING_SERVER:h.online-metrix.net}
app.api.key=${API_KEY:your_api_key}
app.api.base-url=${API_BASE_URL:https://h-api-sb.online-metrix.net}

# Optional 4th demo user (only created if USER4_EMAIL is set)
app.user4.name=${USER4_NAME:}
app.user4.email=${USER4_EMAIL:}
app.user4.password=${USER4_PASSWORD:}

# Comma-separated list of emails that bypass session validation (empty = none)
app.validation.ignore.emails=${VALIDATION_IGNORE_EMAILS:}

